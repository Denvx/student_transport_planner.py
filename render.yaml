services:
  # Um serviço só: o Flask é a API e também entrega a tela (pasta frontend).
  - type: web
    name: aerj-planejamento-rotas
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend api:app
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ORS_API_KEY
        sync: false
